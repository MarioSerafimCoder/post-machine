name: Deploy protegido
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validar configuração de produção
        env:
          CLOUDFLARE_ACCESS_READY: ${{ vars.CLOUDFLARE_ACCESS_READY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$CLOUDFLARE_ACCESS_READY" = "true" || { echo "Configure e verifique Access conforme docs/SETUP.md."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Credenciais Cloudflare ausentes."; exit 1; }
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8")); if (!c.routes?.some(r=>r.pattern==="posts.marioserafim.com.br" && r.custom_domain===true)) throw Error("Configure a rota protegida conforme SETUP.md");'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Publicar Static Assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
