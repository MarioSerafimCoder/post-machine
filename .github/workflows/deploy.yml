name: Radar e deploy protegido
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9,15,21 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  verified:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exigir CI aprovado para o commit exato da publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..40}; do
            result="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$GITHUB_SHA" -f branch=main -f per_page=50 --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | first | if . then [.status, (.conclusion // "pending"), (.id | tostring)] | @tsv else "missing" end')"
            read -r status conclusion run <<< "$result"
            if [[ "$status" == completed ]]; then
              echo "CI $run para $GITHUB_SHA: $conclusion"
              test "$conclusion" = success
              exit $?
            fi
            sleep 15
          done
          echo "Nenhum CI aprovado para $GITHUB_SHA. Publicação interrompida."
          exit 1
  collect:
    if: github.ref == 'refs/heads/main'
    needs: verified
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restaurar a última coleta disponível
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=radar-snapshot&per_page=50" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .id // empty')"
          if [ -n "$artifact" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/radar.zip"
            unzip -p "$RUNNER_TEMP/radar.zip" radar.json > public/radar.json
          fi
      - run: npm run radar:collect
      - name: Restaurar orçamento e cache opcional do YouTube
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=virals-youtube-cache&per_page=30" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .id // empty')"; then
            echo 'YOUTUBE_CACHE_FAILED=true' >> "$GITHUB_ENV"
          elif [ -n "$artifact" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/youtube-cache.zip" || ! unzip -p "$RUNNER_TEMP/youtube-cache.zip" virals-youtube.json > public/virals-youtube.json; then
              echo 'YOUTUBE_CACHE_FAILED=true' >> "$GITHUB_ENV"
            fi
          fi
      - name: Atualizar dados públicos do YouTube quando configurado
        run: node virals/collect.ts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_VIDEO_IDS: ${{ vars.YOUTUBE_VIDEO_IDS }}
          YOUTUBE_REQUESTS_PER_RUN: ${{ vars.YOUTUBE_REQUESTS_PER_RUN }}
          YOUTUBE_REQUESTS_PER_DAY: ${{ vars.YOUTUBE_REQUESTS_PER_DAY }}
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run deploy:check
      - uses: actions/upload-artifact@v4
        with:
          name: radar-snapshot
          path: public/radar.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.YOUTUBE_CACHE_FAILED != 'true'
        with:
          name: virals-youtube-cache
          path: public/virals-youtube.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: radar-dist
          path: dist/
          retention-days: 1
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validar configuração de produção
        env:
          CLOUDFLARE_ACCESS_READY: ${{ vars.CLOUDFLARE_ACCESS_READY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$CLOUDFLARE_ACCESS_READY" = "true" || { echo "Configure e verifique Access conforme docs/SETUP.md."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Credenciais Cloudflare ausentes."; exit 1; }
          npm run deploy:verify-access
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: radar-dist
          path: dist
      - name: Publicar Static Assets
        shell: bash
        run: |
          # O token edita o Worker. O domínio já está vinculado na Cloudflare.
          output="$RUNNER_TEMP/radar-wrangler-output.jsonl"
          WRANGLER_OUTPUT_FILE_PATH="$output" npx wrangler versions upload --message "Radar GitHub Actions $GITHUB_RUN_ID · $GITHUB_SHA"
          version_id="$(jq -er 'select(.type == "version-upload") | .version_id | strings | select(test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"))' "$output")"
          npx wrangler versions deploy "$version_id@100%" --yes --message "Radar GitHub Actions $GITHUB_RUN_ID · $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deploy:verify-access
