name: Radar e deploy protegido
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9,15,21 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  verified:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exigir CI aprovado para o commit exato da publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..40}; do
            result="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$GITHUB_SHA" -f branch=main -f per_page=50 --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | first | if . then [.status, (.conclusion // "pending"), (.id | tostring)] | @tsv else "missing" end')"
            read -r status conclusion run <<< "$result"
            if [[ "$status" == completed ]]; then
              echo "CI $run para $GITHUB_SHA: $conclusion"
              test "$conclusion" = success
              exit $?
            fi
            sleep 15
          done
          echo "Nenhum CI aprovado para $GITHUB_SHA. Publicação interrompida."
          exit 1
  collect:
    if: github.ref == 'refs/heads/main'
    needs: verified
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restaurar a última coleta disponível
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=radar-snapshot&per_page=50" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .id // empty')"
          if [ -n "$artifact" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/radar.zip"
            unzip -p "$RUNNER_TEMP/radar.zip" radar.json > public/radar.json
          fi
      - name: Coletar notícias
        id: radar
        run: npm run radar:collect
      - name: Resumir edição do Radar
        if: always()
        env:
          COLLECTION: ${{ steps.radar.outcome }}
        shell: bash
        run: |
          echo "Resultado da coleta: $COLLECTION" >> "$GITHUB_STEP_SUMMARY"
          if test -s public/radar.json; then
            jq -r '"### Edição disponível após a tentativa\n\nÚltima coleta válida: \(.collectedAt // "indisponível")\n\nÚltima tentativa registrada: \(.attemptedAt)\n\nItens na edição: \(.items | length)\n\nFontes com falha na tentativa registrada: \([.sources[] | select(.error) | .name] | join(", ") | if length == 0 then "nenhuma" else . end)"' public/radar.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhuma edição disponível para publicação." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Restaurar orçamento e cache opcional do YouTube
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=virals-youtube-cache&per_page=30" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .id // empty')"; then
            echo 'YOUTUBE_CACHE_FAILED=true' >> "$GITHUB_ENV"
          elif [ -n "$artifact" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/youtube-cache.zip" || ! unzip -p "$RUNNER_TEMP/youtube-cache.zip" virals-youtube.json > public/virals-youtube.json; then
              echo 'YOUTUBE_CACHE_FAILED=true' >> "$GITHUB_ENV"
            fi
          fi
      - name: Atualizar dados públicos do YouTube quando configurado
        run: node virals/collect.ts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_VIDEO_IDS: ${{ vars.YOUTUBE_VIDEO_IDS }}
          YOUTUBE_REQUESTS_PER_RUN: ${{ vars.YOUTUBE_REQUESTS_PER_RUN }}
          YOUTUBE_REQUESTS_PER_DAY: ${{ vars.YOUTUBE_REQUESTS_PER_DAY }}
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run deploy:check
      - uses: actions/upload-artifact@v4
        with:
          name: radar-snapshot
          path: public/radar.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.YOUTUBE_CACHE_FAILED != 'true'
        with:
          name: virals-youtube-cache
          path: public/virals-youtube.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: radar-dist
          path: dist/
          retention-days: 1
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validar configuração de produção
        env:
          CLOUDFLARE_ACCESS_READY: ${{ vars.CLOUDFLARE_ACCESS_READY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$CLOUDFLARE_ACCESS_READY" = "true" || { echo "Configure e verifique Access conforme docs/SETUP.md."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Credenciais Cloudflare ausentes."; exit 1; }
          npm run deploy:verify-access
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: radar-dist
          path: dist
      - name: Publicar Worker e arquivos estáticos
        id: promote
        shell: bash
        run: |
          [[ "$CLOUDFLARE_ACCESS_ISSUER" =~ ^https://[a-z0-9-]+\.cloudflareaccess\.com$ ]] || { echo "Emissor do Access não configurado para o Worker visual."; exit 1; }
          [[ "$CLOUDFLARE_ACCESS_AUD" =~ ^[[:xdigit:]]{64}$ ]] || { echo "AUD do Access não configurado para o Worker visual."; exit 1; }
          [[ ${#VISUAL_DOWNLOAD_KEY} -ge 32 ]] || { echo "Secret VISUAL_DOWNLOAD_KEY ausente ou inválido."; exit 1; }
          umask 077
          visual_secrets="$(mktemp "$RUNNER_TEMP/visual-worker.XXXXXX")"
          trap 'rm -f -- "$visual_secrets"' EXIT
          jq -n '{ VISUAL_DOWNLOAD_KEY: env.VISUAL_DOWNLOAD_KEY }
            + (if (env.BRAVE_SEARCH_API_KEY // "") != "" then { BRAVE_SEARCH_API_KEY: env.BRAVE_SEARCH_API_KEY } else {} end)
            + (if env.VISUAL_YOUTUBE_QUOTA == "confirmed" and (env.YOUTUBE_API_KEY // "") != ""
               then { YOUTUBE_API_KEY: env.YOUTUBE_API_KEY } else {} end)' > "$visual_secrets"
          brave_mode=disabled
          if [[ "$BRAVE_VISUAL_ZERO_SPEND" == confirmed && -n "$BRAVE_SEARCH_API_KEY" ]]; then brave_mode=confirmed; fi
          output="$RUNNER_TEMP/radar-wrangler-output.jsonl"
          WRANGLER_OUTPUT_FILE_PATH="$output" npx wrangler versions upload --keep-vars --secrets-file "$visual_secrets" \
            --var "CLOUDFLARE_ACCESS_ISSUER:$CLOUDFLARE_ACCESS_ISSUER" --var "CLOUDFLARE_ACCESS_AUD:$CLOUDFLARE_ACCESS_AUD" \
            --var "BRAVE_VISUAL_ZERO_SPEND:$brave_mode" --var "VISUAL_EXTERNAL_HOSTS:$VISUAL_EXTERNAL_HOSTS" \
            --var "VISUAL_YOUTUBE_QUOTA:$VISUAL_YOUTUBE_QUOTA" --var "VISUAL_YOUTUBE_CHANNELS:$VISUAL_YOUTUBE_CHANNELS" \
            --var "VISUAL_BROWSER_FREE:$VISUAL_BROWSER_FREE" --var "VISUAL_BROWSER_HOSTS:$VISUAL_BROWSER_HOSTS" \
            --var "VISUAL_OFFICIAL_HOSTS:$VISUAL_OFFICIAL_HOSTS" --message "Radar GitHub Actions $GITHUB_RUN_ID · $GITHUB_SHA"
          version_id="$(jq -er 'select(.type == "version-upload") | .version_id | strings | select(test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"))' "$output")"
          promotion_log="$RUNNER_TEMP/radar-wrangler-promotion.log"
          for attempt in {1..7}; do
            if npx wrangler versions deploy "$version_id@100%" --yes --message "Radar GitHub Actions $GITHUB_RUN_ID · $GITHUB_SHA" 2>&1 | tee "$promotion_log"; then
              break
            fi
            if [[ "$attempt" -eq 7 ]] || ! grep -Fq '[code: 100146]' "$promotion_log"; then
              exit 1
            fi
            echo "A Cloudflare ainda não encontrou a versão $version_id. Tentando promover a mesma versão novamente."
            sleep "$((attempt * 5))"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_ISSUER: ${{ vars.CLOUDFLARE_ACCESS_ISSUER }}
          CLOUDFLARE_ACCESS_AUD: ${{ vars.CLOUDFLARE_ACCESS_AUD }}
          VISUAL_DOWNLOAD_KEY: ${{ secrets.VISUAL_DOWNLOAD_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BRAVE_VISUAL_ZERO_SPEND: ${{ vars.BRAVE_VISUAL_ZERO_SPEND }}
          VISUAL_EXTERNAL_HOSTS: ${{ vars.VISUAL_EXTERNAL_HOSTS }}
          VISUAL_OFFICIAL_HOSTS: ${{ vars.VISUAL_OFFICIAL_HOSTS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VISUAL_YOUTUBE_QUOTA: ${{ vars.VISUAL_YOUTUBE_QUOTA }}
          VISUAL_YOUTUBE_CHANNELS: ${{ vars.VISUAL_YOUTUBE_CHANNELS }}
          VISUAL_BROWSER_FREE: ${{ vars.VISUAL_BROWSER_FREE }}
          VISUAL_BROWSER_HOSTS: ${{ vars.VISUAL_BROWSER_HOSTS }}
      - name: Verificar acesso após a publicação
        id: access_after
        run: npm run deploy:verify-access -- --visual
      - name: Registrar resultado da publicação
        if: always()
        env:
          PROMOTION: ${{ steps.promote.outcome }}
          ACCESS: ${{ steps.access_after.outcome }}
        run: |
          echo "Promoção da versão: $PROMOTION · Verificação de acesso: $ACCESS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROMOTION" = success ]; then
            jq -r '"Edição publicada: \(.collectedAt) · \(.items | length) itens"' dist/radar.json >> "$GITHUB_STEP_SUMMARY"
          fi
